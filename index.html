<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headroom / monthly budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ground:#E9ECF2;
    --panel:#FFFFFF;
    --ink:#14192B;
    --ink-soft:#5D6478;
    --line:#CFD5E1;
    --line-soft:#E3E7EF;
    --headroom:#0E6F63;
    --over:#AE4136;
    --warn:#BC7F1E;
    --accent:#4655C8;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  .bt-root{
    background:var(--ground);
    color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px;
    line-height:1.45;
    padding:22px;
    min-height:100%;
  }
  .bt-root *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .bt-wrap{max-width:1080px;margin:0 auto;}

  /* ---------- masthead ---------- */
  .bt-mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .bt-mark{
    font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 125;
    font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;
    font-size:15px;line-height:1;
  }
  .bt-mark span{color:var(--accent);}
  .bt-monthnav{display:flex;align-items:center;gap:6px;}
  .bt-monthnav button{
    font-family:"IBM Plex Mono",monospace;font-size:13px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    width:30px;height:30px;border-radius:var(--radius);cursor:pointer;
  }
  .bt-monthnav button:hover{border-color:var(--ink);}
  .bt-monthlabel{
    font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 112;
    font-weight:700;text-transform:uppercase;letter-spacing:0.04em;font-size:13px;
    min-width:132px;text-align:center;
  }

  /* ---------- hero ---------- */
  .bt-hero{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 26px 20px;margin-bottom:14px;
  }
  .bt-eyebrow{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:0.16em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;
  }
  .bt-bignum{
    font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 125;
    font-weight:800;font-size:clamp(46px,9vw,88px);line-height:0.86;
    letter-spacing:-0.035em;font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  }
  .bt-bignum .cur{font-size:0.36em;font-weight:700;color:var(--ink-soft);letter-spacing:0;}
  .bt-bignum.is-over{color:var(--over);}
  .bt-herofoot{
    display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft);
  }
  .bt-heroline{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft);}
  .bt-heroline b{color:var(--ink);font-weight:600;}

  /* pace: two stacked rules, spend vs month elapsed */
  .bt-pace{width:min(360px,100%);}
  .bt-pacerow{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .bt-pacetag{
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:0.1em;
    text-transform:uppercase;color:var(--ink-soft);width:56px;flex:none;
  }
  .bt-pacetrack{flex:1;height:7px;background:var(--line-soft);border-radius:99px;overflow:hidden;}
  .bt-pacefill{height:100%;background:var(--ink);border-radius:99px;transition:width .45s cubic-bezier(.2,.7,.3,1);}
  .bt-pacefill.pace{background:var(--line);}
  .bt-pacefill.over{background:var(--over);}
  .bt-pacenum{
    font-family:"IBM Plex Mono",monospace;font-size:11px;width:40px;text-align:right;flex:none;
    font-variant-numeric:tabular-nums;
  }
  .bt-verdict{
    font-family:"IBM Plex Mono",monospace;font-size:11px;margin-top:8px;letter-spacing:0.02em;
  }
  .bt-verdict.good{color:var(--headroom);}
  .bt-verdict.warn{color:var(--warn);}
  .bt-verdict.bad{color:var(--over);}

  /* ---------- columns ---------- */
  .bt-cols{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;align-items:start;}
  @media (max-width:820px){.bt-cols{grid-template-columns:1fr;}}
  .bt-panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
  }
  .bt-panelhead{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--ink);
  }
  .bt-panelhead h2{
    font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 118;
    font-weight:700;text-transform:uppercase;letter-spacing:0.05em;font-size:12px;margin:0;
  }
  .bt-count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);}

  /* ---------- signature: headroom bars ---------- */
  .bt-cat{margin-bottom:16px;}
  .bt-catline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px;}
  .bt-catname{
    font-weight:600;font-size:13px;letter-spacing:0.01em;
    display:flex;align-items:center;gap:7px;
  }
  .bt-catfig{
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .bt-track{
    position:relative;height:30px;border:1px solid var(--ink);border-radius:var(--radius);
    overflow:hidden;background:transparent;
  }
  .bt-fill{
    position:absolute;inset:0 auto 0 0;background:var(--ink);
    transition:width .5s cubic-bezier(.2,.7,.3,1);
  }
  .bt-fill.over{background:var(--over);}
  .bt-track.is-over{border-color:var(--over);}
  .bt-left{
    position:absolute;right:9px;top:50%;transform:translateY(-50%);
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;
    font-variant-numeric:tabular-nums;color:var(--headroom);
  }
  .bt-left.over{color:var(--over);}
  .bt-catdel{
    background:none;border:none;cursor:pointer;color:var(--line);
    font-size:15px;line-height:1;padding:0 2px;
  }
  .bt-catdel:hover{color:var(--over);}
  .bt-limit{
    width:64px;background:transparent;border:none;border-bottom:1px dashed var(--line);
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);
    text-align:right;padding:0 0 1px;
  }
  .bt-limit:hover{border-bottom-color:var(--ink);}

  /* ---------- ledger ---------- */
  .bt-form{display:grid;grid-template-columns:1fr 92px;gap:8px;margin-bottom:16px;}
  .bt-form .full{grid-column:1 / -1;}
  .bt-form input,.bt-form select{
    width:100%;background:var(--ground);border:1px solid var(--line);border-radius:var(--radius);
    padding:8px 10px;font-family:"IBM Plex Sans",sans-serif;font-size:13px;color:var(--ink);
  }
  .bt-form input[type=number],.bt-form input[type=date]{font-family:"IBM Plex Mono",monospace;font-size:12px;}
  .bt-form input::placeholder{color:var(--ink-soft);opacity:.7;}
  .bt-form input:focus,.bt-form select:focus{background:var(--panel);border-color:var(--ink);outline:none;}
  .bt-btn{
    background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:var(--radius);
    padding:9px 14px;font-family:"Archivo",sans-serif;font-variation-settings:'wdth' 112;
    font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;cursor:pointer;
  }
  .bt-btn:hover{background:var(--accent);border-color:var(--accent);}
  .bt-btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .bt-btn.ghost:hover{background:transparent;color:var(--over);border-color:var(--over);}

  .bt-row{
    display:flex;align-items:baseline;gap:6px;padding:7px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .bt-row:hover .bt-del{opacity:1;}
  .bt-date{
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);
    width:46px;flex:none;font-variant-numeric:tabular-nums;
  }
  .bt-desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;font-size:13px;}
  .bt-leader{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-3px);min-width:12px;}
  .bt-tag{
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:0.06em;
    text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line-soft);
    border-radius:99px;padding:1px 7px;flex:none;
  }
  .bt-amt{
    font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:500;
    font-variant-numeric:tabular-nums;flex:none;
  }
  .bt-del{
    background:none;border:none;cursor:pointer;color:var(--line);font-size:14px;
    line-height:1;padding:0 0 0 2px;opacity:0;transition:opacity .15s;flex:none;
  }
  .bt-del:hover{color:var(--over);}
  .bt-new{animation:btIn .35s cubic-bezier(.2,.7,.3,1);}
  @keyframes btIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

  .bt-empty{
    padding:26px 0;color:var(--ink-soft);font-size:13px;text-align:center;
    border:1px dashed var(--line);border-radius:var(--radius);
  }
  .bt-note{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-soft);
    margin-top:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;
  }
  .bt-warnbar{
    background:#FBF1E3;border:1px solid var(--warn);color:#7A5310;border-radius:var(--radius);
    padding:8px 12px;font-size:12px;margin-bottom:12px;
  }
  @media (prefers-reduced-motion:reduce){
    .bt-root *{animation:none !important;transition:none !important;}
  }
</style>
<style>
  html,body{margin:0;padding:0;min-height:100%;background:#E9ECF2;}
</style>
</head>
<body>
<div class="bt-root">
  <div class="bt-wrap">
    <div class="bt-mast">
      <div class="bt-mark">Head<span>room</span> / monthly budget</div>
      <div class="bt-monthnav">
        <button id="btPrev" aria-label="Previous month">&#8592;</button>
        <div class="bt-monthlabel" id="btMonth">—</div>
        <button id="btNext" aria-label="Next month">&#8594;</button>
      </div>
    </div>

    <div id="btWarn"></div>

    <div class="bt-hero">
      <div class="bt-eyebrow">Left to spend</div>
      <div class="bt-bignum" id="btBig"><span class="cur">S$</span>0.00</div>
      <div class="bt-herofoot">
        <div>
          <div class="bt-heroline">Spent <b id="btSpent">0.00</b> of <b id="btBudget">0.00</b> budgeted</div>
          <div class="bt-verdict" id="btVerdict"></div>
        </div>
        <div class="bt-pace">
          <div class="bt-pacerow">
            <div class="bt-pacetag">Spent</div>
            <div class="bt-pacetrack"><div class="bt-pacefill" id="btSpendFill" style="width:0%"></div></div>
            <div class="bt-pacenum" id="btSpendPct">0%</div>
          </div>
          <div class="bt-pacerow">
            <div class="bt-pacetag">Month</div>
            <div class="bt-pacetrack"><div class="bt-pacefill pace" id="btPaceFill" style="width:0%"></div></div>
            <div class="bt-pacenum" id="btPacePct">0%</div>
          </div>
        </div>
      </div>
    </div>

    <div class="bt-cols">
      <div class="bt-panel">
        <div class="bt-panelhead">
          <h2>Headroom by category</h2>
          <div class="bt-count">Edit a limit to change it</div>
        </div>
        <div id="btCats"></div>
        <div class="bt-form" style="margin-top:18px;margin-bottom:0;">
          <input id="btCatName" placeholder="New category" maxlength="22">
          <input id="btCatLimit" type="number" min="0" step="10" placeholder="Limit">
          <button class="bt-btn full" id="btAddCat">Add category</button>
        </div>
      </div>

      <div class="bt-panel">
        <div class="bt-panelhead">
          <h2>Ledger</h2>
          <div class="bt-count" id="btLedgerCount">0 entries</div>
        </div>
        <div class="bt-form">
          <input class="full" id="btDesc" placeholder="What did you buy?" maxlength="48">
          <select id="btCat"></select>
          <input id="btAmt" type="number" min="0" step="0.01" placeholder="0.00">
          <input class="full" id="btDate" type="date">
          <button class="bt-btn full" id="btAdd">Add expense</button>
        </div>
        <div id="btRows"></div>
        <div class="bt-note">
          <span id="btSaved">Saved automatically</span>
          <button class="bt-btn ghost" id="btReset">Clear all data</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY = 'headroom-budget-v1';

  // Local storage with an in-memory fallback (file:// in some browsers blocks it).
  var store = (function(){
    var mem = {}, ok = true;
    try { window.localStorage.setItem('__hr_t','1'); window.localStorage.removeItem('__hr_t'); }
    catch(e){ ok = false; }
    return {
      get: function(k){
        var v = ok ? window.localStorage.getItem(k) : (mem[k] !== undefined ? mem[k] : null);
        return v === null ? null : {value: v};
      },
      set: function(k,v){ if(!ok){ mem[k] = v; return null; } window.localStorage.setItem(k,v); return {value:v}; },
      delete: function(k){ if(ok) window.localStorage.removeItem(k); else delete mem[k]; return {deleted:true}; }
    };
  })();

  var state = {
    categories: [
      {id:'c1', name:'Food & drink', limit:600},
      {id:'c2', name:'Transport',    limit:200},
      {id:'c3', name:'Bills',        limit:450},
      {id:'c4', name:'Shopping',     limit:300},
      {id:'c5', name:'Everything else', limit:250}
    ],
    expenses: []
  };
  var viewMonth, lastAddedId = null, storageOk = true;

  var money = function(n){
    return (n<0?'-':'') + Math.abs(n).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
  };
  var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); };
  var monthKey = function(d){ return d.slice(0,7); };
  var todayISO = function(){
    var d = new Date(), p = function(x){return String(x).padStart(2,'0');};
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  };
  var monthName = function(mk){
    var parts = mk.split('-');
    var d = new Date(+parts[0], +parts[1]-1, 1);
    return d.toLocaleDateString('en-SG',{month:'long', year:'numeric'});
  };
  var shiftMonth = function(mk, by){
    var parts = mk.split('-');
    var d = new Date(+parts[0], +parts[1]-1+by, 1);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  };

  function warn(msg){
    document.getElementById('btWarn').innerHTML = msg ? '<div class="bt-warnbar">'+msg+'</div>' : '';
  }

  async function load(){
    try{
      var res = await store.get(KEY);
      if(res && res.value){
        var saved = JSON.parse(res.value);
        if(saved.categories && saved.expenses) state = saved;
      }
    }catch(e){
      // No saved data yet, or storage unavailable. Both land here.
    }
  }
  async function save(){
    try{
      var res = await store.set(KEY, JSON.stringify(state));
      if(!res) throw new Error('no result');
      if(!storageOk){ storageOk = true; warn(''); document.getElementById('btSaved').textContent = 'Saved automatically'; }
    }catch(e){
      storageOk = false;
      warn('Changes are not being saved. They will stay in this session only.');
      document.getElementById('btSaved').textContent = 'Not saving';
    }
  }

  function monthExpenses(){
    return state.expenses.filter(function(e){ return monthKey(e.date) === viewMonth; });
  }
  function spentBy(catId){
    return monthExpenses().reduce(function(s,e){ return e.catId===catId ? s+e.amount : s; }, 0);
  }

  function render(){
    var exps = monthExpenses().slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
    var budget = state.categories.reduce(function(s,c){ return s + (c.limit||0); }, 0);
    var spent = exps.reduce(function(s,e){ return s+e.amount; }, 0);
    var left = budget - spent;
    var pct = budget > 0 ? spent/budget*100 : 0;

    document.getElementById('btMonth').textContent = monthName(viewMonth);

    var big = document.getElementById('btBig');
    big.innerHTML = '<span class="cur">S$</span>' + money(left);
    big.classList.toggle('is-over', left < 0);
    document.getElementById('btSpent').textContent = 'S$'+money(spent);
    document.getElementById('btBudget').textContent = 'S$'+money(budget);

    // pace: how far through the month vs how much is gone
    var now = new Date(), parts = viewMonth.split('-');
    var days = new Date(+parts[0], +parts[1], 0).getDate();
    var isCurrent = viewMonth === (now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
    var elapsed = isCurrent ? (now.getDate()/days*100) : (new Date(+parts[0], +parts[1]-1, 1) < now ? 100 : 0);

    document.getElementById('btSpendFill').style.width = Math.min(pct,100)+'%';
    document.getElementById('btSpendFill').classList.toggle('over', pct > 100);
    document.getElementById('btPaceFill').style.width = elapsed+'%';
    document.getElementById('btSpendPct').textContent = Math.round(pct)+'%';
    document.getElementById('btPacePct').textContent = Math.round(elapsed)+'%';

    var v = document.getElementById('btVerdict');
    if(budget === 0){ v.className='bt-verdict'; v.textContent='Set a limit on a category to start tracking.'; }
    else if(left < 0){ v.className='bt-verdict bad'; v.textContent='Over budget by S$'+money(-left)+'.'; }
    else if(pct > elapsed + 8){ v.className='bt-verdict warn'; v.textContent='Ahead of pace. At this rate the month runs out early.'; }
    else if(elapsed > 0){ v.className='bt-verdict good'; v.textContent='On pace with '+Math.round(days - (elapsed/100*days))+' days to go.'; }
    else { v.className='bt-verdict'; v.textContent='Nothing logged yet for this month.'; }

    // categories
    var cats = document.getElementById('btCats');
    cats.innerHTML = state.categories.map(function(c){
      var s = spentBy(c.id);
      var lim = c.limit || 0;
      var p = lim > 0 ? Math.min(s/lim*100, 100) : (s>0?100:0);
      var rem = lim - s;
      var over = rem < 0;
      return '<div class="bt-cat">'+
        '<div class="bt-catline">'+
          '<div class="bt-catname">'+esc(c.name)+
            '<button class="bt-catdel" data-delcat="'+c.id+'" title="Remove category" aria-label="Remove '+esc(c.name)+'">&times;</button>'+
          '</div>'+
          '<div class="bt-catfig">S$'+money(s)+' / <input class="bt-limit" type="number" min="0" step="10" value="'+lim+'" data-limit="'+c.id+'" aria-label="Limit for '+esc(c.name)+'"></div>'+
        '</div>'+
        '<div class="bt-track'+(over?' is-over':'')+'">'+
          '<div class="bt-fill'+(over?' over':'')+'" style="width:'+p+'%"></div>'+
          '<div class="bt-left'+(over?' over':'')+'">'+(over ? 'S$'+money(-rem)+' over' : 'S$'+money(rem)+' left')+'</div>'+
        '</div>'+
      '</div>';
    }).join('') || '<div class="bt-empty">No categories. Add one below.</div>';

    // category select
    var sel = document.getElementById('btCat');
    var keep = sel.value;
    sel.innerHTML = state.categories.map(function(c){
      return '<option value="'+c.id+'">'+esc(c.name)+'</option>';
    }).join('');
    if(keep && state.categories.some(function(c){return c.id===keep;})) sel.value = keep;

    // ledger
    document.getElementById('btLedgerCount').textContent = exps.length + (exps.length===1?' entry':' entries');
    var rows = document.getElementById('btRows');
    rows.innerHTML = exps.length ? exps.map(function(e){
      var cat = state.categories.filter(function(c){return c.id===e.catId;})[0];
      var d = e.date.split('-');
      return '<div class="bt-row'+(e.id===lastAddedId?' bt-new':'')+'">'+
        '<div class="bt-date">'+d[2]+'/'+d[1]+'</div>'+
        '<div class="bt-desc">'+esc(e.desc)+'</div>'+
        '<div class="bt-leader"></div>'+
        '<div class="bt-tag">'+esc(cat ? cat.name : 'unfiled')+'</div>'+
        '<div class="bt-amt">'+money(e.amount)+'</div>'+
        '<button class="bt-del" data-del="'+e.id+'" title="Delete" aria-label="Delete '+esc(e.desc)+'">&times;</button>'+
      '</div>';
    }).join('') : '<div class="bt-empty">Nothing logged for '+monthName(viewMonth).split(' ')[0]+' yet. Add the first expense above.</div>';

    lastAddedId = null;
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
    });
  }

  function addExpense(){
    var desc = document.getElementById('btDesc').value.trim();
    var amt = parseFloat(document.getElementById('btAmt').value);
    var catId = document.getElementById('btCat').value;
    var date = document.getElementById('btDate').value || todayISO();
    if(!amt || amt <= 0){ document.getElementById('btAmt').focus(); return; }
    var e = {id:uid(), desc: desc || 'Unnamed', amount: amt, catId: catId, date: date};
    state.expenses.push(e);
    lastAddedId = e.id;
    viewMonth = monthKey(date);
    document.getElementById('btDesc').value = '';
    document.getElementById('btAmt').value = '';
    render(); save();
    document.getElementById('btDesc').focus();
  }

  document.getElementById('btAdd').addEventListener('click', addExpense);
  ['btDesc','btAmt'].forEach(function(id){
    document.getElementById(id).addEventListener('keydown', function(ev){
      if(ev.key === 'Enter') addExpense();
    });
  });

  document.getElementById('btAddCat').addEventListener('click', function(){
    var n = document.getElementById('btCatName').value.trim();
    var l = parseFloat(document.getElementById('btCatLimit').value) || 0;
    if(!n) { document.getElementById('btCatName').focus(); return; }
    state.categories.push({id:uid(), name:n, limit:l});
    document.getElementById('btCatName').value = '';
    document.getElementById('btCatLimit').value = '';
    render(); save();
  });

  document.addEventListener('click', function(ev){
    var d = ev.target.getAttribute && ev.target.getAttribute('data-del');
    if(d){ state.expenses = state.expenses.filter(function(e){return e.id!==d;}); render(); save(); return; }
    var dc = ev.target.getAttribute && ev.target.getAttribute('data-delcat');
    if(dc){
      state.categories = state.categories.filter(function(c){return c.id!==dc;});
      state.expenses = state.expenses.filter(function(e){return e.catId!==dc;});
      render(); save();
    }
  });

  document.addEventListener('change', function(ev){
    var id = ev.target.getAttribute && ev.target.getAttribute('data-limit');
    if(id){
      var val = parseFloat(ev.target.value) || 0;
      state.categories.forEach(function(c){ if(c.id===id) c.limit = val; });
      render(); save();
    }
  });

  document.getElementById('btPrev').addEventListener('click', function(){ viewMonth = shiftMonth(viewMonth,-1); render(); });
  document.getElementById('btNext').addEventListener('click', function(){ viewMonth = shiftMonth(viewMonth, 1); render(); });

  document.getElementById('btReset').addEventListener('click', async function(){
    state.expenses = [];
    render();
    try{ await store.delete(KEY); }catch(e){}
    save();
  });

  (async function init(){
    document.getElementById('btDate').value = todayISO();
    viewMonth = monthKey(todayISO());
    render();
    await load();
    viewMonth = monthKey(todayISO());
    render();
  })();
})();
</script>
</body>
</html>
